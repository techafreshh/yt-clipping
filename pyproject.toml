[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    # Lower bounds kept above Colab's preinstalled stack (google-adk, gradio,
    # huggingface-hub, ...) so `pip install` on Colab upgrades instead of
    # keeping stale versions that trigger resolver conflicts.
    "click>=8.2,<9",
    "httpx>=0.28.1,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "fastapi>=0.133,<1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.23",
    "yt-dlp>=2024.1.0",
    "bgutil-ytdlp-pot-provider>=1.3.0",
]

[project.scripts]
shorts = "shorts.cli:app"

[project.optional-dependencies]
whisper = [
    "openai-whisper>=20231117",
]
dev = [
    "pytest==8.3.3",
]

[tool.pytest.ini_options]
markers = ["ffmpeg: requires ffmpeg on PATH"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shorts = ["static/*"]
